<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Astha Study AI - Smart Chapter Study</title>
    <meta name="description" content="AI-powered mobile-first PWA for Class 6-10 students with strict Source Lock chapter learning, notes, question generator, and interactive quizzes in Hindi and English." />
    <meta property="og:title" content="Astha Study AI - Smart Chapter Study" />
    <meta property="og:description" content="AI-powered mobile-first PWA for Class 6-10 students with strict Source Lock chapter learning, notes, question generator, and interactive quizzes in Hindi and English." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Astha Study" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully ignore harmless WebSocket HMR disconnect errors in cloud proxy environments
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && e.reason.message && (e.reason.message.indexOf('WebSocket') !== -1 || e.reason.message.indexOf('websocket') !== -1)) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%); color: #ffffff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; text-align: center; padding: 24px;">
        <div style="position: relative; margin-bottom: 24px;">
          <div style="width: 112px; height: 112px; border-radius: 28px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.2); background: #1e1b4b; display: flex; align-items: center; justify-content: center;">
            <img src="/icon.svg" alt="Astha Study AI App Icon" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
        </div>
        <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, #ffffff, #c7d2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
          आस्था STUDY AI
        </h1>
        <p style="margin: 6px 0 28px 0; font-size: 13px; color: #fde047; font-weight: 600; letter-spacing: 0.5px;">
          कक्षा 6-10 स्मार्ट चैप्टर स्टडी साथी
        </p>
        <div style="width: 180px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 10px; overflow: hidden; position: relative;">
          <div style="width: 60%; height: 100%; background: linear-gradient(90deg, #f59e0b, #6366f1, #38bdf8); border-radius: 10px; animation: pulse 1.5s infinite;"></div>
        </div>
        <p style="margin-top: 14px; font-size: 11px; color: #94a3b8;">लोड हो रहा है... (Loading App...)</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
